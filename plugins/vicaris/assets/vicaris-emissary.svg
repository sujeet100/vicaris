<svg xmlns="http://www.w3.org/2000/svg" viewBox="88 32 153 380" width="153" height="380" role="img" aria-label="The Emissary: a masked envoy in a structured mantle, carrying a sealed writ">
  <title>The Emissary</title>
  <!-- Ink #0C0C0F · Bone #E6E1D5 · Brass #C9A961.
       Rules this figure is drawn to, each one learned by breaking it:
       no hood — a pale pointed hood over a dark face reads as Klan imagery whatever was meant;
       no vertical brass mark crossing the visor — it makes a cross, and the point is an envoy
       rather than clergy; no centre vent in the hem — it reads as legs in shorts. What carries
       the character instead is the raised mantle over the writ-bearing shoulder, which is the
       one feature recognisable from silhouette alone. -->
