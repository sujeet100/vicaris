<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="200" height="200" role="img" aria-label="Vicaris">
  <title>Vicaris</title>
  <!-- One ink from `currentColor`, eyes cut out as negative space, so the mark follows the
       surrounding text and inverts with the theme on its own. The eyes are cut with a mask
       rather than an even-odd fill, because the ears overlap the head and even-odd would
       punch that overlap out too. -->
  <defs>
    <mask id="eyes">
      <rect width="16" height="16" fill="#fff"/>
      <path d="M3.6 9.6 L6.9 8.6 L6.6 10.4 L4 10.6 Z"/>
      <path d="M12.4 9.6 L9.1 8.6 L9.4 10.4 L12 10.6 Z"/>
    </mask>
  </defs>
  <g fill="currentColor" mask="url(#eyes)">
    <path d="M1.5 1.5 L3 8 L6.5 6.5 Z"/>
    <path d="M14.5 1.5 L13 8 L9.5 6.5 Z"/>
    <path d="M3 7 L6.5 6 L9.5 6 L13 7 L13.5 9.5 L11 13.5 L8 15 L5 13.5 L2.5 9.5 Z"/>
  </g>
</svg>
